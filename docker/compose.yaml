services:

  timeclock-system:
    container_name: timeclock-system
    hostname: timeclock-system-${INSTANCE_ID:?}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_REPO: https://github.com/AetherBreaker/timeclock-system.git
        GIT_TAG: v0.7.0
    restart: unless-stopped
    volumes:
      - type: bind
        source: /data/timeclock_system_files
        target: /app/persisted_data
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    device_cgroup_rules:
      - c 189:* rmw
    environment:
      - INSTANCE_ID=${INSTANCE_ID:?}
      - CLOCK_NUMBER=${CLOCK_NUMBER:?}
      - HEARTBEAT_SLUG=timeclock-system-${INSTANCE_ID:?}
      - TZ=America/New_York
      - LOG_HISTORY_RETENTION_DAYS=14
      - LOG_CONN_HOST=10.8.0.25
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
      - PINGKEY=${PINGKEY:-}
      - WG_PRIVATE_KEY=${WG_PRIVATE_KEY:?}
      - WG_HUB_URL=${WG_HUB_URL:?}
      - WG_HUB_REPO=${WG_HUB_REPO:?}
      - WG_HUB_TOKEN=${WG_HUB_TOKEN:-}
      - WG_TOLERATE_DISCONNECTED=1
      - WG_HANDSHAKE_TIMEOUT_SECS=10
      - TIMECLOCK_DB_HOST=10.8.0.24
      - TIMECLOCK_DB_NAME=${TIMECLOCK_DB_NAME:?}
      - TIMECLOCK_DB_USER=${TIMECLOCK_DB_USER:?}
      - TIMECLOCK_DB_PASSWORD=${TIMECLOCK_DB_PASSWORD:?}
    cap_add:
      - NET_ADMIN
    # The clock's own browser runs on the host (timeclock-standby's display) and reaches the app here; loopback only, so
    # nothing outside the clock can.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - coolify
    # Fresh heartbeats and the web server answering. The heartbeat files persist across containers, so alone they pass
    # before a new container serves.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /app/.venv/bin/devkit-container healthcheck
          --file /app/persisted_data/logs/heartbeat.txt --file /app/persisted_data/logs/wireguard-heartbeat.txt
          && /app/.venv/bin/python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8080/favicon.ico', timeout=3)"
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  coolify:
    external: true
