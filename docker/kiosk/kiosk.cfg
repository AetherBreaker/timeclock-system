// Firefox skips this file's first line. Prefs the enterprise policies can't set (spec R13.2), and the error-page retry.
lockPref("apz.allow_zooming", false);
lockPref("browser.gesture.pinch.in", "");
lockPref("browser.gesture.pinch.out", "");
lockPref("browser.gesture.swipe.left", "");
lockPref("browser.gesture.swipe.right", "");
lockPref("widget.disable-swipe-tracker", true);
lockPref("browser.sessionstore.resume_from_crash", false);

// Reload an error page every 5 s until the clock loads. Firefox never retries one itself, and the kiosk has no reload
// button. After a reboot Docker starts the kiosk beside the app, ignoring compose's depends_on, so Firefox's first load
// can come before the app serves (main-office, 2026-10-29).
Services.obs.addObserver(win => {
  win.setInterval(() => {
    const browser = win.gBrowser.selectedBrowser;
    if (browser.documentURI?.spec.startsWith("about:neterror")) browser.reload();
  }, 5000);
}, "browser-delayed-startup-finished");
