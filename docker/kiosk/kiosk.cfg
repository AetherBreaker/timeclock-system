// Firefox skips this file's first line. Prefs the enterprise policies can't set (spec R13.2), and the error-page retry.
lockPref("apz.allow_zooming", false);
lockPref("browser.gesture.pinch.in", "");
lockPref("browser.gesture.pinch.out", "");
lockPref("browser.gesture.swipe.left", "");
lockPref("browser.gesture.swipe.right", "");
lockPref("widget.disable-swipe-tracker", true);
lockPref("browser.sessionstore.resume_from_crash", false);

// On an error page, ask the app every 30 s whether it's serving, and reload once it is: Firefox never retries an error
// page itself, and the kiosk has no reload button. After a reboot Docker starts the kiosk beside the app, ignoring
// compose's depends_on, so Firefox's first load can come before the app serves (main-office, 2026-10-29). The probe is
// NiceGUI's favicon, a plain file; requesting the page would build a whole clock page in the app.
Services.obs.addObserver(win => {
  win.setInterval(() => {
    const browser = win.gBrowser.selectedBrowser;
    if (!browser.documentURI?.spec.startsWith("about:neterror")) return;
    win.fetch(browser.currentURI.prePath + "/favicon.ico", { cache: "no-store", signal: win.AbortSignal.timeout(4000) })
      .then(response => response.ok && browser.reload(), () => {});
  }, 30000);
}, "browser-delayed-startup-finished");
